<text x="455" y="845" class="minor">Вход с улицы — условная сторона</text>
<text x="120" y="885" class="sub">Примерно 6,0 × 5,3 м + тамбур 1,8 × 1,4 м. Расстановка обсуждается.</text>
</svg>