<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 910" role="img" aria-labelledby="title desc">
<title id="title">SHOP-01 — предложенная планировка деревенского магазина Берёзовки</title>
<desc id="desc">Сверху подсобка и территория продавца, ниже — зона покупателей с лавкой и доской объявлений. Спереди расположен тамбур. Прилавок и служебная калитка отделяют посетителей от товара. Площадь примерно 35 квадратных метров.</desc>
<style>text{font-family:system-ui,'Segoe UI',Arial,sans-serif;fill:#f0f1e6}.heading{font-size:29px;font-weight:800}.sub{font-size:16px;fill:#b9c7b7}.zone{font-size:23px;font-weight:800}.item{font-size:15px}.minor{font-size:15px;fill:#d4dfd1}.wall{stroke:#d3dec9;stroke-width:8}</style>
<rect width="1000" height="910" fill="#101b15"/>
<text x="120" y="48" class="heading">SHOP-01 · Берёзовка</text><text x="120" y="82" class="sub">Интерьер v1 · предварительная схема, не окончательный канон</text>
<text x="465" y="113" class="sub">6,0 м</text>
<rect x="130" y="132" width="704" height="572" fill="#21362b" stroke="#d3dec9" stroke-width="8"/>
<rect x="130" y="132" width="305" height="333" fill="#324435"/>
<rect x="435" y="132" width="399" height="333" fill="#3d4231"/>
<rect x="130" y="465" width="704" height="239" fill="#233c30"/>
<path d="M435 132 V274 M435 328 V465 M130 465 H435" fill="none" class="wall"/>
<path d="M435 274 L477 301 L435 328" fill="none" stroke="#e0c88e" stroke-width="3"/>
<text x="162" y="168" class="zone">ПОДСОБКА</text><text x="162" y="190" class="minor">≈ 8 м²</text>
<text x="459" y="157" class="zone">ЗОНА ПРОДАВЦА</text>
<text x="459" y="182" class="minor">≈ 10 м² · товары выдаёт продавец</text>
<rect x="148" y="223" width="90" height="80" rx="7" fill="#50674c" stroke="#81927a" stroke-width="1.5"/><text x="193" y="229" text-anchor="middle" class="item">Коробки</text><rect x="253" y="223" width="136" height="52" rx="7" fill="#50674c" stroke="#81927a" stroke-width="1.5"/><text x="321" y="215" text-anchor="middle" class="item">Бакалея</text><rect x="146" y="326" width="100" height="56" rx="7" fill="#665a46" stroke="#81927a" stroke-width="1.5"/><text x="196" y="321" text-anchor="middle" class="item">Хоз. шкаф</text><rect x="260" y="326" width="125" height="56" rx="7" fill="#496b73" stroke="#81927a" stroke-width="1.5"/><text x="322.5" y="321" text-anchor="middle" class="item">Мойка</text><rect x="455" y="219" width="275" height="47" rx="7" fill="#666c51" stroke="#81927a" stroke-width="1.5"/><text x="592.5" y="197.5" text-anchor="middle" class="item">Консервы • чай • крупы</text><rect x="456" y="292" width="111" height="85" rx="7" fill="#685b43" stroke="#81927a" stroke-width="1.5"/><text x="511.5" y="294.5" text-anchor="middle" class="item">Овощи</text><rect x="581" y="292" width="87" height="85" rx="7" fill="#45666e" stroke="#81927a" stroke-width="1.5"/><text x="624.5" y="294.5" text-anchor="middle" class="item">Холод.</text><rect x="681" y="292" width="87" height="85" rx="7" fill="#45666e" stroke="#81927a" stroke-width="1.5"/><text x="724.5" y="294.5" text-anchor="middle" class="item">Мороз.</text><rect x="157" y="542" width="174" height="52" rx="7" fill="#54664d" stroke="#81927a" stroke-width="1.5"/><text x="244" y="573" text-anchor="middle" class="item">Доска объявлений</text><rect x="164" y="613" width="135" height="43" rx="7" fill="#685a43" stroke="#81927a" stroke-width="1.5"/><text x="231.5" y="639.5" text-anchor="middle" class="item">Скамья</text>
<rect x="451" y="390" width="351" height="63" rx="9" fill="#7d6447" stroke="#e9bd80" stroke-width="4"/>
<text x="635" y="427" class="zone" text-anchor="middle">ПРИЛАВОК</text>
<path d="M435 390 V453" stroke="#cfac75" stroke-width="7" stroke-dasharray="14 9"/>
<text x="158" y="499" class="zone">ЗОНА ПОКУПАТЕЛЕЙ</text><text x="158" y="525" class="minor">≈ 14 м² · никаких открытых полок</text>
