function line(x){return '<div class="progress"><b style="width:'+pct(x)+'%"></b></div>'}
function pathname(){return decodeURIComponent((location.hash||"#/").slice(1))}
function header(t,k){return '<div class="eyebrow">'+escape(k||"FINAL COIL / Путеводитель")+'</div><h1>'+escape(t)+'</h1>'}
function card(x){return '<a class="tile" href="#/location/'+x.id+'"><div class="art"><span>'+escape(x.cat)+'</span></div><div class="tile-body"><div class="row"><h3>'+escape(x.title)+'</h3><span class="pill">'+pct(x)+'%</span></div><p>'+escape(x.lead)+'</p>'+line(x)+'<div class="side-note">Открыть паспорт →</div></div></a>'}
function list(arr){return '<div class="data-list">'+arr.map(function(x){return '<div><span>'+escape(x)+'</span></div>'}).join("")+'</div>'}
function overallSummary(){return '<div class="donut-wrap"><div class="donut" style="--percent:'+overall()+'"><div>'+overall()+'%<small>описаний</small></div></div><div><h3>Что означает процент?</h3><p class="muted small">Каждая из девяти локаций оценивается по пяти критериям: образ, объекты, атмосфера, действия и окончательное утверждение. Проценты показывают глубину документации, а не готовность Unreal Engine.</p><div class="check"><span class="key"></span>Описано &nbsp; <span class="key off"></span>Ещё обсуждаем</div></div></div>'}
function pageHome(){var incomplete=places.filter(function(x){return pct(x)<100}).slice(0,5);return '<section class="hero"><div class="kicker">Мир, который не обязан тебя замечать</div><h1>FINAL COIL.<br>От идеи — к миру.</h1><p>Единый визуальный путеводитель: какие локации уже придуманы, что решено и какие вопросы остаются открытыми. Сюжетные тайны и концовки здесь не раскрываются.</p><div class="buttons"><a class="btn" href="#/world">Исследовать мир →</a><a class="btn secondary" href="#/progress">Посмотреть прогресс</a><a class="btn secondary" href="#/roadmap">План проработки</a></div><p class="small">Берёзовка · Архангельская область · Старый Бор · песочница · выживание · неоднозначная мистика</p></section><div class="grid stats"><div class="stat"><div class="lab">Наполненность локаций</div><div class="number">'+overall()+'%</div><div class="lab">Документация, не UE5</div></div><div class="stat"><div class="lab">Локации в каталоге</div><div class="number">'+places.length+'</div><div class="lab">Все ещё в проработке</div></div><div class="stat"><div class="lab">Принятые положения</div><div class="number">'+decisions.filter(function(x){return x[1]==="Принято"}).length+'</div><div class="lab">И цели, и открытые вопросы отдельно</div></div><div class="stat"><div class="lab">Цель длительности</div><div class="number">15–20</div><div class="lab">часов, до плейтестов</div></div></div><div class="split"><div class="panel"><h3>Общая наполненность</h3>'+overallSummary()+'</div><div class="panel"><h3>В очереди на проработку</h3>'+incomplete.map(function(x){return '<div class="progress-entry"><div class="row"><a href="#/location/'+x.id+'">'+escape(x.title)+'</a><b>'+pct(x)+'%</b></div>'+line(x)+'</div>'}).join("")+'</div></div><h2>Путеводитель по местам</h2><div class="grid">'+places.slice(0,6).map(card).join("")+'</div><h2>Правило разработки мира</h2><div class="note">Сначала подробно описываем каждое место: среду, объекты, действия и атмосферу. Только потом определяем их размещение на карте, расстояния и дороги. Не превращаем черновую карту в утверждённый канон.</div>'+roadmapTeaser()}
function roadmapCard(w,i){return '<a class="tile stream" href="#/roadmap/'+w.id+'"><div class="tile-body"><div class="roadmap-head"><span class="stream-number">НАПРАВЛЕНИЕ '+String(i+1).padStart(2,"0")+'</span><span class="pill">'+escape(w.status)+'</span></div><h3>'+escape(w.title)+'</h3><p>'+escape(w.summary)+'</p><div class="side-note">Открыть план обсуждения →</div></div></a>'}
function roadmapTeaser(){return '<h2>17 направлений проектирования</h2><p class="intro">Шесть исходных направлений и одиннадцать новых — полный план для проектирования, производства и выпуска. Важные решения уже приняты, но ни одна большая спецификация пока не закрыта.</p><div class="grid">'+workstreams.slice(0,6).map(roadmapCard).join("")+'</div><p class="side-note"><a href="#/roadmap">Посмотреть все 17 направлений →</a></p>'}
function pageRoadmap(){return header("План проработки","17 направлений / 6 существующих + 11 новых")+'<p class="intro">Шесть первоначальных направлений сохранены. Добавлены одиннадцать новых, необходимых для законченной игры. Приоритеты — предложение для планирования, не утверждённый график и не процент готовности UE5.</p><div class="roadmap-flag"><strong>Порядок работы над миром:</strong> сначала паспорта отдельных локаций — объекты, атмосфера, действия. Размещение на общей карте, дороги и расстояния обсудим после утверждения всех мест.</div>'+workGroups.map(function(g){var arr=workstreams.filter(function(w){return w.group===g});return '<h2>'+escape(g)+' <span class="group-count">'+arr.length+' направл.</span></h2><div class="grid">'+arr.map(function(w){return roadmapCard(w,workstreams.indexOf(w))}).join("")+'</div>'}).join("")+'<h2>Когда направление можно считать проработанным</h2><div class="data-list"><div><strong>1. Согласованы основные правила</strong><span>Фиксируем, как механика или часть мира должна работать и что мы намеренно не делаем.</span></div><div><strong>2. Закрыты основные вопросы</strong><span>Получены конкретные ответы, а не только список идей.</span></div><div><strong>3. Документировано в Obsidian</strong><span>Есть актуальный паспорт или дизайн-спецификация, на которую ссылается сайт.</span></div><div><strong>4. Определён прототип</strong><span>Понятен минимальный объём проверки в UE5; это отдельный этап, не процент документации.</span></div></div>'}
function pageWorkstream(id){var w=workstreams.find(function(t){return t.id===id});if(!w)return header("Направление не найдено");return '<a class="crumb-link" href="#/roadmap">← К плану проработки</a>'+header(w.title,'ПЛАН ПРОЕКТИРОВАНИЯ')+'<p class="intro">'+escape(w.summary)+'</p><div class="meta"><span class="pill">'+escape(w.status)+'</span><span class="pill">'+escape(w.group)+'</span><span class="pill">Очередность: '+escape(w.stage)+'</span></div><div class="note"><strong>Ожидаемый результат:</strong> '+escape(w.result)+'</div><h2>Что уже известно</h2>'+list(w.known)+'<h2>Что предстоит обсудить</h2>'+list(w.questions)+'<p class="side-note">В путеводителе нет спойлеров о конкретных миссиях и концовках. Подробные рабочие решения и история обсуждений остаются в Obsidian.</p>'}
function pageWorld(){return header("Атлас мира","9 направлений проработки")+'<p class="intro">Деревня, дом, лес, озеро и следы лесной промышленности. Каждый объект мира должен быть полезен даже игроку, который не расследует мистические истории.</p><input id="find" class="searchbar" type="search" placeholder="Найти локацию по названию или описанию…"><div id="filters" class="filters">'+cats.map(function(c,i){return '<button class="filter '+(i===0?'on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join("")+'</div><div class="grid" id="cards">'+places.map(card).join("")+'</div>'}
function pageProgress(){return header("Прогресс локаций","Степень проработки, а не код и ассеты")+'<div class="split"><div class="panel">'+overallSummary()+'</div><div class="panel"><h3>Пять критериев</h3><div class="data-list">'+order.map(function(o,i){return '<div><strong>0'+(i+1)+'. '+o+'</strong><span>'+["Чёткий природный или архитектурный образ","Перечень построек, предметов и особенностей","Звуки, погода, время суток и настроение","Повторяемые бытовые и исследовательские действия","Паспорт проверен и согласован"][i]+'</span></div>'}).join("")+'</div></div></div><h2>Все локации</h2><div class="panel">'+places.map(function(x){return '<div class="progress-entry"><div class="row"><a href="#/location/'+x.id+'"><strong>'+escape(x.title)+'</strong></a><b>'+pct(x)+'%</b></div>'+line(x)+'<div class="check">'+order.map(function(s,i){return (x.checks[i]?"✓ ":"○ ")+escape(s)}).join(" · ")+'</div></div>'}).join("")+'</div>'}
function pageLocation(id){var x=places.find(function(item){return item.id===id});if(!x)return header("Локация не найдена");return '<a class="crumb-link" href="#/world">← К атласу мира</a>'+header(x.title,x.cat+' / ПАСПОРТ ЛОКАЦИИ')+'<p class="intro">'+escape(x.lead)+'</p><div class="meta"><span class="pill">Проработано: '+pct(x)+'%</span><span class="pill">Статус: черновик</span><span class="pill">Расположение: ещё не утверждено</span></div><div class="note">'+escape(x.idea)+'</div><h2>Что находится здесь</h2>'+list(x.objects)+'<h2>Атмосфера и среда</h2>'+list(x.atmosphere)+'<h2>Чем может заниматься игрок</h2>'+list(x.actions)+'<h2>Что ещё нужно решить</h2>'+list(x.questions)+'<h2>Полнота паспорта</h2><div class="panel">'+order.map(function(o,i){return '<div class="progress-entry"><span class="'+(x.checks[i]?'status':'muted')+'">'+(x.checks[i]?'✓':'○')+'</span> &nbsp;'+o+'</div>'}).join("")+line(x)+'</div><p class="side-note">Внимание: здесь описаны окружающая среда и возможные действия, без спойлеров о миссиях и концовках.</p>'}
function pageDecisions(){return header("Реестр решений","Что уже решили / что ещё обсуждаем")+'<div class="panel"><table><thead><tr><th>Положение</th><th>Статус</th></tr></thead><tbody>'+decisions.map(function(d){return '<tr><td>'+escape(d[0])+'</td><td class="'+(d[1]==="Принято"?"status":"warning")+'">'+escape(d[1])+'</td></tr>'}).join("")+'</tbody></table></div><p class="side-note">Исходная рабочая документация хранится в Obsidian. Этот сайт — удобный путеводитель, а не самостоятельный редактор.</p>'}
function pageMap(){return header("Будущая карта","Сначала проектируем места")+'<div class="note">Детальную карту мира намеренно не утверждаем. В текущем порядке работы сначала прорабатываются паспорта всех локаций; затем — соседство зон, рельеф, дороги, пешие маршруты и поездки на машине.</div><h2>Текущие локации</h2><div class="grid">'+places.map(card).join("")+'</div>'}
function pageGuide(){return header("Как устроен путеводитель","FINAL COIL · Документация")+'<div class="split"><div class="panel"><h3>Obsidian — источник истины</h3><p class="muted">Подробные заметки, история решений, GDD, dev diary, планы разработки и техническая документация находятся в Obsidian.</p></div><div class="panel"><h3>Сайт — публичная витрина знаний</h3><p class="muted">Здесь удобно проверять наполнение мира, смотреть паспорта локаций, утверждённые решения и открытые вопросы. Сайт статический, без бэкенда.</p></div></div><h2>Статусы</h2><div class="data-list"><div><strong>Принято</strong><span>Договорились использовать как основу проекта.</span></div><div><strong>Цель</strong><span>Желаемый результат, пока не проверенный на практике.</span></div><div><strong>Открыто</strong><span>Требует отдельного обсуждения.</span></div><div><strong>Наполненность</strong><span>Полнота текста и структуры — не процент реализации в UE5.</span></div></div><h2>Важное ограничение</h2><div class="note">Этот первоначальный GitHub-вариант содержит основные паспорта и решения. Для загрузки полной библиотеки Markdown из Obsidian предусмотрен отдельный экспорт в следующих версиях.</div>'}
function render(){var path=pathname(),labels={"/":"Обзор проекта","/world":"Атлас мира","/progress":"Прогресс","/roadmap":"План проработки","/decisions":"Решения","/map":"Карта","/guide":"О путеводителе"};document.getElementById("breadcrumb").textContent="Путеводитель / "+(labels[path]||(path.startsWith("/location/")?"Паспорт места":"Раздел"));document.getElementById("nav").innerHTML=nav.map(function(x){return '<a class="'+(path===x[0]?"active":"")+'" href="#'+x[0]+'">'+x[1]+' <small>↗</small></a>'}).join("");document.getElementById("places").innerHTML=places.map(function(x){return '<a class="'+(path==="/location/"+x.id?"active":"")+'" href="#/location/'+x.id+'">'+escape(x.title)+' <small>'+pct(x)+'%</small></a>'}).join("");main.innerHTML=path==="/" ? pageHome():path==="/world"?pageWorld():path==="/progress"?pageProgress():path==="/roadmap"?pageRoadmap():path.startsWith("/roadmap/")?pageWorkstream(path.split("/")[2]):path==="/decisions"?pageDecisions():path==="/map"?pageMap():path==="/guide"?pageGuide():path.startsWith("/location/")?pageLocation(path.split("/")[2]):pageHome();window.scrollTo(0,0);sidebar.classList.remove("open");document.getElementById("overlay").classList.remove("on");var search=document.getElementById("find"),filters=document.getElementById("filters");if(search&&filters){var category="Все";function apply(){var q=search.value.toLowerCase();document.getElementById("cards").innerHTML=places.filter(function(x){return (category==="Все"||category===x.cat)&&(x.title+" "+x.lead+" "+x.idea).toLowerCase().includes(q)}).map(card).join("")||'<p class="muted">Ничего не найдено</p>'}search.addEventListener("input",apply);filters.addEventListener("click",function(e){if(e.target.dataset.cat){category=e.target.dataset.cat;filters.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.cat===category)});apply()}})}}
document.getElementById("mobileBtn").addEventListener("click",function(){sidebar.classList.toggle("open");document.getElementById("overlay").classList.toggle("on")});document.getElementById("overlay").addEventListener("click",function(){sidebar.classList.remove("open");this.classList.remove("on")});window.addEventListener("hashchange",render);render();
})();
</script>
</body></html>
