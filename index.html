дения: почему жители сохранили три сосны и что сами говорят о часовне.","Источники могут быть противоречивыми: устные воспоминания, старые фотографии и документы за пределами часовни. Конкретные улики — не канон.","Реальный Артемий Веркольский почитается на Русском Севере; события его жития не являются автоматически событиями вымышленной Сосновки."]};

function pageDemo(){return "<a class=\"crumb-link\" href=\"#/roadmap\">← К плану проработки</a><div class=\"eyebrow\">ПРОИЗВОДСТВО / ПЕРВЫЙ СРЕЗ</div><h1>Первая рабочая демоверсия</h1><p class=\"intro\">Сначала четыре составляющие: деревня, дом деда, гараж и машина. После их объединения — рабочая сборка, тестирование и исправления. Это план, а не отчёт о том, что UE5 уже готова.</p><div class=\"note\"><strong>Не раздуваем объём:</strong> не нужно делать 19 уникальных интерьеров, все NPC, весь лес и всю мифологию. Небольшая временная демо-карта — тест масштаба, а не утверждённая география полноценной игры.</div><h2>Четыре составляющие</h2><div id=\"demo-components\"></div><h2>Сейчас — P0</h2><div id=\"demo-p0\"></div><p><a class=\"btn secondary\" href=\"#/house\">Типовой дом (согласован) →</a><a class=\"btn secondary\" href=\"#/grandfather-estate\">Участок деда: паспорт →</a><a class=\"btn secondary\" href=\"#/garage\">План гаража v1 →</a></p><h2>Отложено — P2</h2><div class=\"note\"><strong>История Сосновки / поиск прошлого деревни</strong> — добавлена в список дел. Возможна необязательная арка, связанная с Часовней у Трёх Сосен. Конкретные события, улики и концовка пока не утверждены. Для первой демоверсии не требуется.</div><h2>После сборки</h2><p>Пройти тестовый кусок мира, проверить ощущения, масштабы, скорость и производительность, зафиксировать ошибки и только потом расширять содержание.</p><p class=\"side-note\">Obsidian → 05 Разработка / 45 Демоверсия — четыре составляющие.md · 46 Бэклог задач.md.</p>".replace('<div id="demo-components"></div>',pairList(demoComponents)).replace('<div id="demo-p0"></div>',list(demoTasks))}
function pageHouse(){return "<a class=\"crumb-link\" href=\"#/demo\">← К демоверсии</a><div class=\"eyebrow\">ДЕРЕВНЯ / СОГЛАСОВАН БАЗОВЫЙ ТИП</div><h1>Типовой дом Сосновки</h1><p class=\"intro\">Один базовый северный деревянный дом, который можно использовать для множества дворов. Пока не придумываем хозяев, сюжеты домов и уникальные интерьеры.</p><div class=\"meta\"><span class=\"pill\">Базовая форма дома — согласована</span><span class=\"pill\">Размеры и детали — пока предложения</span></div><h2>Предлагаемый внешний вид</h2><div id=\"house-features\"></div><h2>Работа в UE5</h2><div class=\"note\">Один корпус, несколько вариантов кровли и окон, наличники, входная группа, заборы и хозяйственные детали. Состояние двора меняется без необходимости создавать 19 уникальных зданий. Полноценные интерьеры в демке сосредоточим в доме деда и гараже.</div><h2>Что ещё обсудить</h2><p>Тип дома утверждён. Осталось проверить реальные габариты в UE5, подобрать кровлю, расположение окон, вариации отделки, состояние дворов и количество пристроек.</p><p class=\"side-note\">Историческая опора: <a href=\"https://site.kizhi.karelia.ru/library/tserkov-preobrazheniya-gospodnya-na-ostrove-kizhi-300-let-na-zaonezhskoj-zemle-sbor/1438.html\" target=\"_blank\" rel=\"noopener noreferrer\">Музей «Кижи»</a>. Obsidian → 02 Мир / 20 Сосновка — типовой дом.md.</p>".replace('<div id="house-features"></div>',pairList(houseFeatures))}

function pageHome(){var incomplete=places.filter(function(x){return pct(x)<100}).slice(0,5);return '<section class="hero"><div class="kicker">Мир, который не обязан тебя замечать</div><h1>FINAL COIL.<br>От идеи — к миру.</h1><p>Единый визуальный путеводитель: какие локации уже придуманы, что решено и какие вопросы остаются открытыми. Сюжетные тайны и концовки здесь не раскрываются.</p><div class="buttons"><a class="btn" href="#/world">Исследовать мир →</a><a class="btn secondary" href="#/progress">Посмотреть прогресс</a><a class="btn secondary" href="#/roadmap">План проработки</a><a class="btn secondary" href="#/demo">Первое демо</a></div><p class="small">Сосновка · Архангельская область · Старый Бор · песочница · выживание · неоднозначная мистика</p></section><div class="grid stats"><div class="stat"><div class="lab">Наполненность локаций</div><div class="number">'+overall()+'%</div><div class="lab">Документация, не UE5</div></div><div class="stat"><div class="lab">Локации в каталоге</div><div class="number">'+places.length+'</div><div class="lab">Все ещё в проработке</div></div><div class="stat"><div class="lab">Принятые положения</div><div class="number">'+decisions.filter(function(x){return x[1]==="Принято"}).length+'</div><div class="lab">И цели, и открытые вопросы отдельно</div></div><div class="stat"><div class="lab">Цель длительности</div><div class="number">15–20</div><div class="lab">часов, до плейтестов</div></div></div><div class="split"><div class="panel"><h3>Общая наполненность</h3>'+overallSummary()+'</div><div class="panel"><h3>В очереди на проработку</h3>'+incomplete.map(function(x){return '<div class="progress-entry"><div class="row"><a href="#/location/'+x.id+'">'+escape(x.title)+'</a><b>'+pct(x)+'%</b></div>'+line(x)+'</div>'}).join("")+'</div></div><h2>Путеводитель по местам</h2><div class="grid">'+places.slice(0,6).map(card).join("")+'</div><h2>Правило разработки мира</h2><div class="note">Сначала подробно описываем каждое место: среду, объекты function pageRoadmap(){return header("План проработки","17 направлений / 6 существующих + 11 новых")+'<p class="intro">Шесть первоначальных направлений сохранены. Добавлены одиннадцать новых, необходимых для законченной игры. Приоритеты — предложение для планирования, не утверждённый график и не процент готовности UE5.</p><div class="roadmap-flag"><strong>Порядок работы над миром:</strong> сначала паспорта отдельных локаций — объекты, атмосфера, действия. Размещение на общей карте, дороги и расстояния обсудим после утверждения всех мест.</div>'+workGroups.map(function(g){var arr=workstreams.filter(function(w){return w.group===g});return '<h2>'+escape(g)+' <span class="group-count">'+arr.length+' направл.</span></h2><div class="grid">'+arr.map(function(w){return roadmapCard(w,workstreams.indexOf(w))}).join("")+'</div>'}).join("")+'<h2>Приоритет: первое демо</h2><div class="note"><strong>Сейчас:</strong> деревня, дом деда, гараж, машина → сборка и тест. <a href="#/demo">План демо</a>.<p class="small"><strong>В очереди на потом:</strong> история Сосновки / исследование прошлого деревни. Пока без сценария.</p></div>'+'<h2>Когда направление можно считать проработанным</h2><div class="data-list"><div><strong>1. Согласованы основные правила</strong><span>Фиксируем, как механика или часть мира должна работать и что мы намеренно не делаем.</span></div><div><strong>2. Закрыты основные вопросы</strong><span>Получены конкретные ответы, а не только список идей.</span></div><div><strong>3. Документировано в Obsidian</strong><span>Есть актуальный паспорт или дизайн-спецификация, на которую ссылается сайт.</span></div><div><strong>4. Определён прототип</strong><span>Понятен минимальный объём проверки в UE5; это отдельный этап, не процент документации.</span></div></div>'}

function pageStore(){return "<a class=\"crumb-link\" href=\"#/location/berezovka\">← К Сосновке</a><div class=\"eyebrow\">БЕРЁЗОВКА / SHOP-01</div><h1>Деревенский магазин</h1><p class=\"intro\">Маленький деревянный дом с настоящим деревенским прилавком. Здесь закупаются не только жители Сосновки: за товарами приезжают и из соседних поселений.</p><div class=\"meta\"><span class=\"pill\">Частично утверждено</span><span class=\"pill\">Прилавочная торговля — принято</span><span class=\"pill\">Игровой ассортимент — открыт</span></div><h2>Фотогалерея</h2><p class=\"muted\">Это фотографии других реальных магазинов, а не игровые скриншоты. Исходные файлы трёх динамических изображений из предыдущего сообщения не сохранились — подобраны близкие референсы с лицензиями.</p><div class=\"shop-photos\"><figure class=\"shop-photo\"><a href=\"assets/shop/exterior.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img loading=\"lazy\" src=\"assets/shop/exterior.jpg\" alt=\"Внешний вид: Деревянный магазин, 2008\"></a><figcaption><strong>Внешний вид</strong><br>Деревянный магазин, 2008<br>Фото: <a href=\"https://commons.wikimedia.org/wiki/File:Brynchagi-shop-01.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">PereslavlFoto</a> · <a href=\"https://creativecommons.org/licenses/by-sa/3.0/\" target=\"_blank\" rel=\"noopener noreferrer\">CC BY-SA 3.0</a> · Уменьшена копия</figcaption></figure><figure class=\"shop-photo\"><a href=\"assets/shop/interior.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img loading=\"lazy\" src=\"assets/shop/interior.jpg\" alt=\"Торговый зал: Деревенский магазин, 2007\"></a><figcaption><strong>Торговый зал</strong><br>Деревенский магазин, 2007<br>Фото: <a href=\"https://commons.wikimedia.org/wiki/File:Village_shop_Russia.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Lite</a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">CC BY-SA 4.0</a> · Уменьшена копия</figcaption></figure><figure class=\"shop-photo\"><a href=\"assets/shop/shelves.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img loading=\"lazy\" src=\"assets/shop/shelves.jpg\" alt=\"Полки с товарами: Референс выкладки, 2019\"></a><figcaption><strong>Полки с товарами</strong><br>Референс выкладки, 2019<br>Фото: <a href=\"https://commons.wikimedia.org/wiki/File:Grocery_store_shelf_in_Russia.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Alexander Davronov</a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">CC BY-SA 4.0</a> · Уменьшена копия</figcaption></figure></div><h2>Планировка интерьера</h2><p>Состав помещений уже обсуждён, а расстановка оборудования пока проектная.</p><p><a class=\"btn\" href=\"#/shop/layout\">Открыть планировку →</a></p><h2>Что утвердили</h2><div id=\"shop-agreed\"></div><h2>Звуки и атмосфера</h2><div id=\"shop-ambience\"></div><h2>Товары на полках</h2><div class=\"panel\"><table><thead><tr><th>Категория</th><th>Примеры</th><th>Продажа игроку</th></tr></thead><tbody><tr><td><strong>Сезонные овощи</strong></td><td>картофель, морковь, капуста, лук, свёкла</td><td class=\"warning\">Решим позже</td></tr><tr><td><strong>Консервы</strong></td><td>тушёнка, рыбные консервы, заготовки</td><td class=\"warning\">Решим позже</td></tr><tr><td><strong>Мясо</strong></td><td>замороженное мясо и курица</td><td class=\"warning\">Решим позже</td></tr><tr><td><strong>Повседневные продукты</strong></td><td>хлеб, крупы, чай, макароны, сахар, соль</td><td class=\"warning\">Решим позже</td></tr><tr><td><strong>Бытовая химия</strong></td><td>мыло, порошок, чистящие средства</td><td class=\"warning\">Решим позже</td></tr><tr><td><strong>Хозяйственные мелочи</strong></td><td>скотч, изолента, батарейки, свечи, спички</td><td class=\"warning\">Решим позже</td></tr></tbody></table></div><h2>Что ещё обсуждаем</h2><div id=\"shop-opened\"></div><div class=\"meta\"><a class=\"btn secondary\" href=\"#/location/berezovka\">Вернуться к д function pageShopLayout(){return '<a class="crumb-link" href="#/shop">← К магазину Сосновки</a>'+header("Планировка магазина","SHOP-01 / ИНТЕРЬЕР · ПРЕДЛОЖЕНИЕ")+'<p class="intro">Компактный магазин, где покупатель находится перед прилавком, а все товары расположены на стороне продавца. Стены и размеры представлены для обсуждения и проверки в UE5.</p><div class="meta"><span class="pill">Прилавочная торговля — утверждено</span><span class="pill">Поставка раз в неделю — утверждено</span><span class="pill">Расположение мебели — черновик</span></div><figure class="shop-floorplan"><img loading="lazy" src="assets/shop/layout-v1.svg" alt="Схема магазина сверху: подсобка слева сзади, рабочая зона продавца справа сзади, прилавок, зал покупателей и тамбур спереди"><figcaption>Верх схемы — дальняя стена. Низ — вход. Глобальное размещение магазина на карте ещё не определено. <a href="assets/shop/layout-v1.svg" target="_blank" rel="noopener noreferrer">Открыть схему отдельно</a></figcaption></figure><h2>Пошагово по стенам и зонам</h2><div class="data-list">'+shopZones.map(function(z,i){return '<div><strong>'+String(i+1).padStart(2,"0")+' · '+escape(z[0])+'</strong><span>'+escape(z[1])+'</span></div>'}).join("")+'</div><h2>Размеры для greybox</h2><div class="panel"><table><thead><tr><th>Зона</th><th>Размер</th><th>Статус</th></tr></thead><tbody>'+shopSizes.map(function(z){return '<tr><td>'+escape(z[0])+'</td><td>'+escape(z[1])+'</td><td class="warning">Предложение</td></tr>'}).join("")+'</tbody></table></div><h2>Что ещё утвердить</h2>'+list(["Оставляем предложенное разделение на четыре зоны?","Подходит ли размещение подсобки слева, а рабочей зоны справа?","Нужны ли скамья и доска объявлений у покупателей?","Утвердить расположение окон, холодильников и служебной двери после проверки масштабов"])+'<p class="side-note">Полное описание хранится в Obsidian: 02 Мир/18 Сосновка — планировка магазина.md. Экономика, ассортимент покупок игрока и точный день поставки пока открыты.</p>'}

function pageChapel(){return '<a class="crumb-link" href="#/location/berezovka">← К Сосновке</a>'+header(chapel.name,'CHAPEL-01 / ОСНОВНЫЕ РЕШЕНИЯ УТВЕРЖДЕНЫ')+'<p class="intro">Православная часовня, посвящённая '+escape(chapel.dedication)+'. Очень старая деревянная постройка на краю Сосновки, у трёх больших сосен и Старого Бора.</p><div class="meta"><span class="pill">Название утверждено</span><span class="pill">Посвящение утверждено</span><span class="pill">Доступный интерьер, свечи — принято</span></div><h2>Утверждённые решения</h2>'+list(chapel.agreed)+'<h2>Архитектура, окружение и предметы</h2>'+list(chapel.objects)+'<h2>Что может делать игрок</h2>'+list(chapel.interactions)+'<div class="note"><strong>Без таблички и конкретной даты:</strong> не указываем год строительства и не размещаем у часовни письменную краткую историю. Её прошлое может передаваться устно.</div><h2>Возможная арка — поиски прошлого Сосновки</h2><div class="note"><strong>Идея для разработки, не утверждённый сюжет.</strong> Игрок при желании мог бы изучать историю деревни; никаких обязательных миссий, сюжетных улик и ответов о мистике пока не согласовано.</div>'+list(chapel.lore)+'<h2>Что осталось решить</h2>'+list(chapel.open)+'<p class="side-note">Исторический контекст: <a href="https://verkola.ru/st-otrok-artemij/" target="_blank" rel="noopener noreferrer">Веркольский монастырь</a> · <a href="https://site.kizhi.karelia.ru/library/ryabinin-2003/97.html" target="_blank" rel="noopener noreferrer">музей-заповедник «Кижи»</a>. Obsidian: 02 Мир/19 Сосновка — часовня у Старого Бора.md.</p>'}
function pageVillageBuildings(){var cats=[["Жилая","12 жилых усадеб"],["Пустующая","7 пустующих усадеб"]];return '<a class="crumb-link" href="#/location/berezovka">← К Сосновке</a>'+header("Каталог зданий","Архивные 19 эскизов / новая карта — 26 участков")+'<p class="intro">Число домов утверждено, но представленные ниже индивидуальные варианты — черновики. Идентификаторы H01–H12 и E01–E07 не являются адресами или расположением на карте. Индивидуальный дизайн дворов отложен до теста демоверсии; сначала согласуем <a href="#/house">типовой дом</a>.</p><div class="note"><strong>Часовня утверждена:</strong> маленькая, старая, деревянная, православная, у Старого Бора. Несколько жителей ухаживают за ней. Посвящение праведному отроку Артемию Веркольскому утверждено, интерьер доступен.</div>'+cats.map(function(c){return '<h2>'+c[1]+'</h2><div class="grid">'+villageBuildings.filter(function(x){return x[2]===c[0]}).map(function(x){return '<div class="panel"><div class="eyebrow">'+escape(x[0])+' · '+escape(x[2])+'</div><h3>'+escape(x[1])+'</h3><p class="muted small">'+escape(x[3])+'</p></div>'}).join("")+'</div>'}).join("")+'<h2>Общественные постройки</h2><div class="split"><div class="panel"><h3>Магазин</h3><p class="muted small">Лавка с продуктами и бытовыми вещами. График, поставки и ассортимент — открыты.</p></div><div class="panel"><h3>Часовня у Трёх Сосен</h3><p class="muted small">Старая, но поддерживаемая в порядке жителями. Не капище и не доказательство мистики.</p></div></div><h2>Что решаем дальше</h2>'+list(["Утверждаем или меняем индивидуальный облик усадеб","Уточняем два сезонных дома и счёт дома деда","Выбираем несколько доступных интерьеров","Прорабатываем отдельно магазин, часовню и жителей"])+'<p class="side-note">Дома пока не размещаются на глобальной карте. Полный черновой каталог ведём в Obsidian: 02 Мир/16 Сосновка — каталог зданий.md.</p>'}

function initCarCatalog(){var input=document.getElementById("car-search"),select=document.getElementById("car-filter");if(!input||!select)return;var groups=[].slice.call(document.querySelectorAll(".car-card"));function apply(){var q=input.value.toLowerCase().trim(),kind=select.value,visible=0;groups.forEach(function(d){var any=false;[].slice.call(d.querySelectorAll(".car-sub")).forEach(function(section){var found=false;[].slice.call(section.querySelectorAll("li")).forEach(function(li){var yes=(!q||(li.dataset.search||"").includes(q))&&(kind==="all"||li.dataset.status===kind);li.hidden=!yes;if(yes)found=true});section.hidden=!found;if(found)any=true});d.hidden=!any;if(any&&(q||kind!=="all"))d.open=true;if(any)visible++});document.getElementById("car-empty").hidden=visible>0}input.addEventListener("input",apply);select.addEventListener("change",apply);document.getElementById("car-items").addEventListener("click",function(ev){var a=ev.target.closest("[data-part-id]");if(a&&a.dataset.partId){ev.preventDefault();FCAssembly.openCard(a.dataset.partId)}});document.querySelectorAll("[data-carjump]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();if(select.value!=="all"){select.value="all";apply()}var d=document.getElementById("car-"+(Number(a.dataset.carjump)+1));if(!d)return;d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"})})})}
