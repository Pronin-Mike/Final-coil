уждения: почему жители сохранили три сосны и что сами говорят о часовне.","Источники могут быть противоречивыми: устные воспоминания, старые фотографии и документы за пределами часовни. Конкретные улики — не канон.","Реальный Артемий Веркольский почитается на Русском Севере; события его жития не являются автоматически событиями вымышленной Берёзовки."]};

function pageDemo(){return "<a class=\"crumb-link\" href=\"#/roadmap\">← К плану проработки</a><div class=\"eyebrow\">ПРОИЗВОДСТВО / ПЕРВЫЙ СРЕЗ</div><h1>Первая рабочая демоверсия</h1><p class=\"intro\">Сначала четыре составляющие: деревня, дом деда, гараж и машина. После их объединения — рабочая сборка, тестирование и исправления. Это план, а не отчёт о том, что UE5 уже готова.</p><div class=\"note\"><strong>Не раздуваем объём:</strong> не нужно делать 19 уникальных интерьеров, все NPC, весь лес и всю мифологию. Небольшая временная демо-карта — тест масштаба, а не утверждённая география полноценной игры.</div><h2>Четыре составляющие</h2><div id=\"demo-components\"></div><h2>Сейчас — P0</h2><div id=\"demo-p0\"></div><p><a class=\"btn secondary\" href=\"#/house\">Типовой дом (согласован) →</a><a class=\"btn secondary\" href=\"#/grandfather-estate\">Участок деда: паспорт →</a><a class=\"btn secondary\" href=\"#/garage\">План гаража v1 →</a></p><h2>Отложено — P2</h2><div class=\"note\"><strong>История Берёзовки / поиск прошлого деревни</strong> — добавлена в список дел. Возможна необязательная арка, связанная с Часовней у Трёх Сосен. Конкретные события, улики и концовка пока не утверждены. Для первой демоверсии не требуется.</div><h2>После сборки</h2><p>Пройти тестовый кусок мира, проверить ощущения, масштабы, скорость и производительность, зафиксировать ошибки и только потом расширять содержание.</p><p class=\"side-note\">Obsidian → 05 Разработка / 45 Демоверсия — четыре составляющие.md · 46 Бэклог задач.md.</p>".replace('<div id="demo-components"></div>',pairList(demoComponents)).replace('<div id="demo-p0"></div>',list(demoTasks))}
function pageHouse(){return "<a class=\"crumb-link\" href=\"#/demo\">← К демоверсии</a><div class=\"eyebrow\">ДЕРЕВНЯ / СОГЛАСОВАН БАЗОВЫЙ ТИП</div><h1>Типовой дом Берёзовки</h1><p class=\"intro\">Один базовый северный деревянный дом, который можно использовать для множества дворов. Пока не придумываем хозяев, сюжеты домов и уникальные интерьеры.</p><div class=\"meta\"><span class=\"pill\">Базовая форма дома — согласована</span><span class=\"pill\">Размеры и детали — пока предложения</span></div><h2>Предлагаемый внешний вид</h2><div id=\"house-features\"></div><h2>Работа в UE5</h2><div class=\"note\">Один корпус, несколько вариантов кровли и окон, наличники, входная группа, заборы и хозяйственные детали. Состояние двора меняется без необходимости создавать 19 уникальных зданий. Полноценные интерьеры в демке сосредоточим в доме деда и гараже.</div><h2>Что ещё обсудить</h2><p>Тип дома утверждён. Осталось проверить реальные габариты в UE5, подобрать кровлю, расположение окон, вариации отделки, состояние дворов и количество пристроек.</p><p class=\"side-note\">Историческая опора: <a href=\"https://site.kizhi.karelia.ru/library/tserkov-preobrazheniya-gospodnya-na-ostrove-kizhi-300-let-na-zaonezhskoj-zemle-sbor/1438.html\" target=\"_blank\" rel=\"noopener noreferrer\">Музей «Кижи»</a>. Obsidian → 02 Мир / 20 Берёзовка — типовой дом.md.</p>".replace('<div id="house-features"></div>',pairList(houseFeatures))}

function pageBusStop(){return '<a class="crumb-link" href="#/demo">← К демоверсии</a>'+header("Автобусная остановка","БЕРЁЗОВКА / STOP-01 / ЧЕРНОВИК")+'<p class="intro">Для деревни нужен простой ориентир у дороги. Предлагаю маленький деревянный навес со скамьёй. Остановка входит в план демо, но внешний облик ещё не согласован.</p><div class="meta"><span class="pill">В плане первой демо</span><span class="pill">Внешний вид — на обсуждении</span><span class="pill">Автобусные рейсы — позже</span></div><h2>Предлагаемый вариант</h2>'+pairList(stopDetails)+'<h2>Что нужно утвердить</h2>'+list(stopQuestions)+'<div class="note">Не раздуваем первый прототип: остановка не требует системы расписания, покупки билетов и движения автобуса. Её положение на глобальной карте окончательно не задано.</div><p class="side-note">Obsidian: 02 Мир / 21 Берёзовка — автобусная остановка.md</p>'}
function pageHome(){var incomplete=places.filter(function(x){return pct(x)<100}).slice(0,5);return '<section class="hero"><div class="kicker">Мир, который не обязан тебя замечать</div><h1>FINAL COIL.<br>От идеи — к миру.</h1><p>Единый визуальный путеводитель: какие локации уже придуманы, что решено и какие вопросы остаются открытыми. Сюжетные тайны и концовки здесь не раскрываются.</p><div class="buttons"><a class="btn" href="#/world">Исследовать мир →</a><a class="btn secondary" href="#/progress">Посмотреть прогресс</a><a class="btn secondary" href="#/roadmap">План проработки</a><a class="btn secondary" href="#/demo">Первое демо</a></div><p class="small">Берёзовка · Архангельская область · Старый Бор · песочница · выживание · неоднозначная мистика</p></section><div class="grid stats"><div class="stat"><div class="lab">Наполненность локаций</div><div class="number">'+overall()+'%</div><div class="lab">Документация, не UE5</div></div><div class="stat"><div class="lab">Локации в каталоге</div><div class="number">'+places.length+'</div><div class="lab">Все ещё в проработке</div></div><div class="stat"><div class="lab">Принятые положения</div><div class="number">'+decisions.filter(function(x){return x[1]==="Принято"}).length+'</div><div class="lab">И цели, и открытые вопросы отдельно</div></div><div class="stat"><div class="lab">Цель длительности</div><div class="number">15–20</div><div class="lab">часов, до плейтестов</div></div></div><div class="split"><div class="panel"><h3>Общая наполненность</h3>'+overallSummary()+'</div><div class="panel"><h3>В очереди на проработку</h3>'+incomplete.map(function(x){return '<div class="progress-entry"><div class="row"><a href="#/location/'+x.id+'">'+escape(x.title)+'</a><b>'+pct(x)+'%</b></div>'+line(x)+'</div>'}).join("")+'</div></div><h2>Путеводитель по местам</h2><div class="grid">'+places.slice(0,6).map(card).join("")+'</div><h2>Правило разработки мира</h2><div class="note">Сначала подробно описываем каждое место: среду, объект function pageStore(){return "<a class=\"crumb-link\" href=\"#/location/berezovka\">← К Берёзовке</a><div class=\"eyebrow\">БЕРЁЗОВКА / SHOP-01</div><h1>Деревенский магазин</h1><p class=\"intro\">Маленький деревянный дом с настоящим деревенским прилавком. Здесь закупаются не только жители Берёзовки: за товарами приезжают и из соседних поселений.</p><div class=\"meta\"><span class=\"pill\">Частично утверждено</span><span class=\"pill\">Прилавочная торговля — принято</span><span class=\"pill\">Игровой ассортимент — открыт</span></div><h2>Фотогалерея</h2><p class=\"muted\">Это фотографии других реальных магазинов, а не игровые скриншоты. Исходные файлы трёх динамических изображений из предыдущего сообщения не сохранились — подобраны близкие референсы с лицензиями.</p><div class=\"shop-photos\"><figure class=\"shop-photo\"><a href=\"assets/shop/exterior.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img loading=\"lazy\" src=\"assets/shop/exterior.jpg\" alt=\"Внешний вид: Деревянный магазин, 2008\"></a><figcaption><strong>Внешний вид</strong><br>Деревянный магазин, 2008<br>Фото: <a href=\"https://commons.wikimedia.org/wiki/File:Brynchagi-shop-01.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">PereslavlFoto</a> · <a href=\"https://creativecommons.org/licenses/by-sa/3.0/\" target=\"_blank\" rel=\"noopener noreferrer\">CC BY-SA 3.0</a> · Уменьшена копия</figcaption></figure><figure class=\"shop-photo\"><a href=\"assets/shop/interior.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"><img loading=\"lazy\" src=\"assets/shop/interior.jpg\" alt=\"Торговый зал: Деревенский магазин, 2007\"></a><figcaption><strong>Торговый зал</strong><br>Деревенский магазин, 2007<br>Фото: <a href=\"https://commons.wikimedia.org/wiki/File:Village_shop_Russia.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Lite</a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">CC BY-SA 4.0</a> · Уменьшена копия</figcaption></figure><figure function pageShopLayout(){return '<a class="crumb-link" href="#/shop">← К магазину Берёзовки</a>'+header("Планировка магазина","SHOP-01 / ИНТЕРЬЕР · ПРЕДЛОЖЕНИЕ")+'<p class="intro">Компактный магазин, где покупатель находится перед прилавком, а все товары расположены на стороне продавца. Стены и размеры представлены для обсуждения и проверки в UE5.</p><div class="meta"><span class="pill">Прилавочная торговля — утверждено</span><span class="pill">Поставка раз в неделю — утверждено</span><span class="pill">Расположение мебели — черновик</span></div><figure class="shop-floorplan"><img loading="lazy" src="assets/shop/layout-v1.svg" alt="Схема магазина сверху: подсобка слева сзади, рабочая зона продавца справа сзади, прилавок, зал покупателей и тамбур спереди"><figcaption>Верх схемы — дальняя стена. Низ — вход. Глобальное размещение магазина на карте ещё не определено. <a href="assets/shop/layout-v1.svg" target="_blank" rel="noopener noreferrer">Открыть схему отдельно</a></figcaption></figure><h2>Пошагово по стенам и зонам</h2><div class="data-list">'+shopZones.map(function(z,i){return '<div><strong>'+String(i+1).padStart(2,"0")+' · '+escape(z[0])+'</strong><span>'+escape(z[1])+'</span></div>'}).join("")+'</div><h2>Размеры для greybox</h2><div class="panel"><table><thead><tr><th>Зона</th><th>Размер</th><th>Статус</th></tr></thead><tbody>'+shopSizes.map(function(z){return '<tr><td>'+escape(z[0])+'</td><td>'+escape(z[1])+'</td><td class="warning">Предложение</td></tr>'}).join("")+'</tbody></table></div><h2>Что ещё утвердить</h2>'+list(["Оставляем предложенное разделение на четыре зоны?","Подходит ли размещение подсобки слева, а рабочей зоны справа?","Нужны ли скамья и доска объявлений у покупателей?","Утвердить расположение окон, холодильников и служебной двери после проверки масштабов"])+'<p class="side-note">Полное описание хранится в Obsidian: 02 Мир/18 Берёзовка — планировка магазина.md. Экономика, ассортимент покупок игрока и точный день поставки пока открыты.</p>'}

function pageChapel(){return '<a class="crumb-link" href="#/location/berezovka">← К Берёзовке</a>'+header(chapel.name,'CHAPEL-01 / ОСНОВНЫЕ РЕШЕНИЯ УТВЕРЖДЕНЫ')+'<p class="intro">Православная часовня, посвящённая '+escape(chapel.dedication)+'. Очень старая деревянная постройка на краю Берёзовки, у трёх больших сосен и Старого Бора.</p><div class="meta"><span class="pill">Название утверждено</span><span class="pill">Посвящение утверждено</span><span class="pill">Доступный интерьер, свечи — принято</span></div><h2>Утверждённые решения</h2>'+list(chapel.agreed)+'<h2>Архитектура, окружение и предметы</h2>'+list(chapel.objects)+'<h2>Что может делать игрок</h2>'+list(chapel.interactions)+'<div class="note"><strong>Без таблички и конкретной даты:</strong> не указываем год строительства и не размещаем у часовни письменную краткую историю. Её прошлое может передаваться устно.</div><h2>Возможная арка — поиски прошлого Берёзовки</h2><div class="note"><strong>Идея для разработки, не утверждённый сюжет.</strong> Игрок при желании мог бы изучать историю деревни; никаких обязательных миссий, сюжетных улик и ответов о мистике пока не согласовано.</div>'+list(chapel.lore)+'<h2>Что осталось решить</h2>'+list(chapel.open)+'<p class="side-note">Исторический контекст: <a href="https://verkola.ru/st-otrok-artemij/" target="_blank" rel="noopener noreferrer">Веркольский монастырь</a> · <a href="https://site.kizhi.karelia.ru/library/ryabinin-2003/97.html" target="_blank" rel="noopener noreferrer">музей-заповедник «Кижи»</a>. Obsidian: 02 Мир/19 Берёзовка — часовня у Старого Бора.md.</p>'}
