<text x="441" y="210" class="t">ЗА ПРИЛАВКОМ</text><text x="441" y="233" class="sub">Рабочая зона ~10 м²</text>
<rect x="438" y="257" width="231" height="40" rx="5" fill="#74755a" class="block"/><text x="466" y="283" class="tiny">Консервы, крупы, чай</text>
<rect x="436" y="314" width="102" height="77" rx="6" fill="#716248" class="block"/><text x="455" y="345" class="tiny">Овощи</text><text x="449" y="366" class="tiny">в ящиках</text>
<rect x="555" y="315" width="88" height="77" rx="6" fill="#3f6870" class="block"/><text x="561" y="350" class="tiny">Холод.</text>
<rect x="661" y="315" width="84" height="77" rx="6" fill="#3f6870" class="block"/><text x="669" y="349" class="tiny">Мороз.</text>
