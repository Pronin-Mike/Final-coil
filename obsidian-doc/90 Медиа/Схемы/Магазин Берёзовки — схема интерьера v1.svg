<rect x="134" y="256" width="90" height="84" rx="6" fill="#536c4e" class="block"/><text x="148" y="286" class="tiny">Коробки</text><text x="150" y="306" class="tiny">и запас</text>
<rect x="246" y="255" width="126" height="54" rx="5" fill="#526a4c" class="block"/><text x="257" y="284" class="tiny">Бакалея</text>
