<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" role="img" aria-labelledby="name desc">
<title id="name">Магазин Берёзовки — пример планировки</title><desc id="desc">Дальний левый угол — подсобка, дальний правый — продавец и полки. Перед прилавком — зона покупателей, на входе маленький тамбур. Все размеры предварительные.</desc>
<defs><style>
text{font-family:DejaVu Sans,Arial,sans-serif;fill:#ecf0e4}.t{font-size:19px;font-weight:700}.sub{font-size:14px;fill:#d7e0cf}.tiny{font-size:12px;fill:#becdbb}.wall{stroke:#9fb29c;stroke-width:6;fill:none}.partition{stroke:#b7c6ad;stroke-width:6}.block{stroke:#9dac8f;stroke-width:2}.note{fill:#a9bc9e;font-size:13px}
</style></defs>
<rect width="900" height="940" fill="#101a15"/>
<text x="92" y="63" font-size="29" font-weight="bold">SHOP-01 · Берёзовка</text><text x="92" y="95" font-size="16" fill="#b7c5b1">Планировка интерьера — черновик v1 · не утверждена</text>
<text x="430" y="143" class="note">6,0 м</text><path d="M110 154 H770" stroke="#738a79" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="40" y="485" class="note" transform="rotate(-90 40 485)">5,3 м — основной корпус</text>
<rect x="110" y="174" width="660" height="583" rx="2" stroke="#d1ddca" stroke-width="8" fill="#20352a"/>
<rect x="110" y="174" width="286" height="330" fill="#334335" />
<rect x="396" y="174" width="374" height="330" fill="#3d4230"/>
